function Icon({ name, size=18, sw=2, className='' }) {
  if (!ICONS[name]) return null;
  return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true">
    ${ICONS[name].map((s, i) => s.t === 'p'
      ? html`<path key=${i} d=${s.d}/>`
      : html`<circle key=${i} cx=${s.cx} cy=${s.cy} r=${s.r}/>`)}
  </svg>`;
}
const firstName = n => (n || '?').trim().split(/\s+/)[0];

function dayLabel(ts) {
  const d = new Date(ts), t = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, t)) return 'Today';
  if (same(d, new Date(t.getTime() - 864e5))) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' })
    + (d.getFullYear() !== t.getFullYear() ? ' ' + d.getFullYear() : '');
}
const timeLabel = ts => new Date(ts).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' });

const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const chunkCode = c => String(c || '').replace(/(.{4})(?=.)/g, '$1-');
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };

/* ---------------- splid chat · ids, friends & 1:1 messages ---------------- */

const CHAT_ROOT = 'splidchat/v1/';
const cTopic = (...p) => CHAT_ROOT + p.join('/');
const normId = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const newChatId = () => Array.from({ length: 8 }, () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join('');

/* any ID from 3 to 14 letters/numbers works — shorter or longer than 8, it registers as-is and
   friends can find & request it. What you type is exactly what you get: no padding, no forced length. */
/* dice: a random ID grown from the chosen name — "Meera" → MEE482, ITSME7739, MECHAT42 … */
const idFromName = nm => {
  const base = normId(nm);
  if (base.length < 2) return newChatId();
  const digs = n => Array.from({ length: n }, () => String(Math.floor(Math.random() * 10))).join('');
  const pats = [
    () => base.slice(0, 3 + Math.floor(Math.random() * 3)) + digs(2 + Math.floor(Math.random() * 3)),          /* MEE + a few digits */
    () => 'ITS' + base.slice(0, 2 + Math.floor(Math.random() * 2)) + digs(2 + Math.floor(Math.random() * 3)),  /* ITSME + digits */
    () => base.slice(0, 2) + 'CHAT' + digs(1 + Math.floor(Math.random() * 3)),                                 /* MECHAT + digits */
  ];
  return pats[Math.floor(Math.random() * pats.length)]();
};
const freshChat = () => ({ me: null, friends: {}, reqsIn: {}, reqsOut: {}, threads: {}, unread: {}, seenUpto: {} });

/* ---------------- splid vault — the device keyring that makes sign-in instant & offline-proof ----------------
   Every ID this device has ever created or signed into keeps its password proof (salt + hash) and a full
   local archive (friends, requests, chats) here — so signing in again NEVER depends on the network. */
const VAULT_KEY = 'hisaab.chat.vault';
const vaultAll = () => { try { const v = JSON.parse(localStorage.getItem(VAULT_KEY)); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; } catch (e) { return {}; } };
const vaultGet = id => vaultAll()[normId(id)] || null;
const vaultPut = (id, entry) => {
  try {
    const k = normId(id); if (!k) return;
    const all = vaultAll();
    all[k] = { ...(all[k] || {}), ...entry, id: k, savedAt: Date.now() };
    localStorage.setItem(VAULT_KEY, JSON.stringify(all));
  } catch (e) {}
};
const vaultDrop = id => { try { const all = vaultAll(); delete all[normId(id)]; localStorage.setItem(VAULT_KEY, JSON.stringify(all)); } catch (e) {} };
/* snapshot a chat state for the vault — threads capped so the keyring stays small */
const vaultPickState = c => {
  const cap = n => { const th = {}; Object.keys(c.threads || {}).forEach(k => { th[k] = (c.threads[k] || []).slice(-n); }); return th; };
  const base = { me: c.me, friends: c.friends || {}, reqsIn: c.reqsIn || {}, reqsOut: c.reqsOut || {}, threads: cap(60), unread: c.unread || {}, seenUpto: c.seenUpto || {}, updatedAt: Date.now() };
  try { if (JSON.stringify(base).length > 700000) base.threads = cap(25); } catch (e) {}
  try { if (JSON.stringify(base).length > 700000) base.threads = {}; } catch (e) {}
  return base;
};
const vaultArchive = (id, chatState) => { if (id && chatState && chatState.me) vaultPut(id, { archive: { at: Date.now(), state: vaultPickState(chatState) } }); };
/* wipe every ID this device may have saved before — nothing comes back, every open starts brand-new */
try { localStorage.removeItem(KEY); } catch (e) {}
try { localStorage.removeItem('hisaab.chat'); } catch (e) {}
try { localStorage.removeItem(VAULT_KEY); } catch (e) {}

/* ---------------- file attachments — any type, up to 200 MB, sent peer-to-peer ----------------
   MQTT (public broker) only carries the tiny metadata offer + WebRTC signaling.
   The actual bytes travel browser→browser over an RTCDataChannel, so 200 MB is no problem.
   Received blobs are kept in IndexedDB — localStorage is far too small for big files. */

const FILE_MAX = 200 * 1024 * 1024;
const prettyBytes = n => {
  n = +n || 0;
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n >= 100 ? Math.round(n) : Math.round(n * 10) / 10) + ' ' + u[i];
};
const fileKindOf = (mime, name) => {
  const m = String(mime || ''), n = String(name || '').toLowerCase();
  if (/^image\//.test(m) || /\.(png|jpe?g|gif|webp|bmp|svg|heic|avif)$/.test(n)) return 'image';
  if (/^video\//.test(m) || /\.(mp4|mov|mkv|webm|avi|m4v)$/.test(n)) return 'video';
  if (/^audio\//.test(m) || /\.(mp3|wav|ogg|m4a|aac|flac)$/.test(n)) return 'audio';
  if (/\.pdf$/.test(n) || m === 'application/pdf') return 'pdf';
  if (/\.(zip|rar|7z|tar|gz|bz2|xz)$/.test(n)) return 'zip';
  if (/\.(docx?|xlsx?|pptx?|csv|txt|md|pages)$/.test(n)) return 'doc';
  return 'file';
};

/* IndexedDB blob store with in-memory fallback (some contexts block IDB) */
const FILE_DB = 'splidchat-files';
let _fileDb = null;
const memFiles = new Map();
const idbRun = (mode, fn) => new Promise((res, rej) => {
  let done = false;
  const fail = e => { if (!done) { done = true; rej(e || new Error('idb')); } };

/* one retained-message pull with a short "absent" window — the primitive behind every lookup.
   Resolves { data, connected } so callers can tell "network down" from "truly not there". */
function pullRetained(topic, match, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    if (typeof mqtt === 'undefined') { resolve({ data: null, connected: false }); return; }
    let c;
    try { c = mqtt.connect(opts.url || MQTT_URL, { clientId: 'splidp-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 6000 }); }
    catch (e) { resolve({ data: null, connected: false }); return; }
    let done = false, sawConn = false, to = null, fast = null;
    const finish = v => { if (done) return; done = true; clearTimeout(to); clearTimeout(fast); try { c.end(true); } catch (e) {} resolve(v); };
    to = setTimeout(() => finish({ data: null, connected: sawConn }), opts.timeout || 5000);
    c.on('connect', () => {
      sawConn = true;
      try { c.subscribe(topic, { qos: 0 }); } catch (e) {}
      fast = setTimeout(() => finish({ data: null, connected: true }), opts.fastMs || 2600); // retained (or absence) resolves fast after connect
    });
    c.on('message', (t, payload) => {
      const s = payload.toString();
      if (!s) { finish({ data: null, connected: true }); return; }
      try { const d = JSON.parse(s); if (d && match(d)) finish({ data: d, connected: true }); } catch (e) {}
    });
    c.on('error', () => finish({ data: null, connected: sawConn }));
    c.on('close', () => { if (!done && sawConn) finish({ data: null, connected: true }); });
  });
}

async function fetchChatProfile(id, timeout) {
  const r = await pullRetained(cTopic('profile', id), d => d.app === 'splidchat' && d.profile && d.profile.id === id, { timeout: timeout || 4500, fastMs: 2400 });

}

const BROKERS = [MQTT_URL, 'wss://broker.emqx.io:8084/mqtt'];
/* live handshake — when retained lookups come back empty (public brokers sometimes stop serving retained
   messages), ping splidchat/v1/need/<ID>: any ONLINE device that owns the ID answers with its profile or
   state over live delivery. Only helps while the owner is online somewhere — but that's the common case
   (signing in on a laptop while your phone still has the account open). */
function lookupLive(id, want, timeout) {
  return new Promise(resolve => {
    if (typeof mqtt === 'undefined') { resolve({ data: null, connected: false }); return; }
    let c;
    try { c = mqtt.connect(MQTT_URL, { clientId: 'splidn-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 6000 }); }
    catch (e) { resolve({ data: null, connected: false }); return; }
    let done = false, sawConn = false, to = null, rep1 = null, rep2 = null;
    const finish = v => { if (done) return; done = true; clearTimeout(to); clearTimeout(rep1); clearTimeout(rep2); try { c.end(true); } catch (e) {} resolve(v); };
    const matchProfile = d => d && d.app === 'splidchat' && d.profile && d.profile.id === id;
    const matchState = d => d && d.app === 'splidchat' && d.type === 'state' && d.state && d.state.me && d.state.me.id === id;
    to = setTimeout(() => finish({ data: null, connected: sawConn }), timeout || 4200);
    c.on('connect', () => {
      sawConn = true;
      try { c.subscribe(want === 'state' ? cTopic('state', id) : cTopic('profile', id), { qos: 0 }); } catch (e) {}
      const ping = () => { try { c.publish(cTopic('need', id), JSON.stringify({ app: 'splidchat', type: 'need', want, id, t: Date.now() }), { qos: 0 }); } catch (e) {} };
      ping(); rep1 = setTimeout(ping, 900); rep2 = setTimeout(ping, 2000);
    });
    c.on('message', (t, payload) => {
      const s = payload.toString(); if (!s) return;
      try { const d = JSON.parse(s); if ((want === 'state' && matchState(d)) || (want !== 'state' && matchProfile(d))) finish({ data: d, connected: true }); } catch (e) {}
    });

}
/* sign-in identity chase — device vault is checked before this; here we chase the ID across two brokers and
   both retained topics, then a live handshake, before ever saying "not found". Offline stays distinguishable. */
async function lookupIdentity(id, onStep) {
  const tries = [
    { kind: 'profile', url: BROKERS[0] },
    { kind: 'profile', url: BROKERS[1] },
    { kind: 'state', url: BROKERS[0] },
    { kind: 'state', url: BROKERS[1] },
    { kind: 'live', want: 'profile' },
    { kind: 'live', want: 'state' },
  ];
  let connected = false, src = null, srcKind = null;
  for (let i = 0; i < tries.length && !src; i++) {
    const t = tries[i];
    if (onStep) { try { onStep(t.kind === 'live' ? 'live' : (t.kind === 'profile' ? 'lookup' : 'cloud')); } catch (e) {} }
    let r;
    if (t.kind === 'live') r = await lookupLive(id, t.want, 4200);
    else r = await pullRetained(
      cTopic(t.kind, id),
      t.kind === 'profile'
        ? d => d.app === 'splidchat' && d.profile && d.profile.id === id
        : d => d.app === 'splidchat' && d.type === 'state' && d.state && d.state.me && d.state.me.id === id,
      { url: t.url, timeout: i === 0 ? 6000 : 4600, fastMs: i === 0 ? 2600 : 2200 }
    );
    if (r.connected) connected = true;
    if (r.data) { src = t.kind === 'state' || (t.kind === 'live' && t.want === 'state') ? r.data.state : r.data.profile; srcKind = t.kind === 'live' && t.want === 'state' ? 'state' : t.kind; }
  }
  return { src, srcKind, connected };
}

/* SHA-256 hex, pure-JS fallback for contexts where crypto.subtle is unavailable (e.g. file://) */
function sha256Hex(str) {
  const maxWord = Math.pow(2, 32);
  let ascii;
  try { ascii = encodeURIComponent(String(str)).replace(/%([0-9A-F]{2})/g, (m, p) => String.fromCharCode(parseInt(p, 16))); }
  catch (e) { ascii = String(str); }
  const words = [];
  const asciiBitLength = ascii.length * 8;
  const hash = [], k = [];
  let primeCounter = 0;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (asciiBitLength / maxWord) | 0;
  words[words.length] = asciiBitLength;
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  for (let j0 = 0; j0 < words.length;) {
    const w = words.slice(j0, j0 += 16);
    const oldHash = hash.slice(0);
    const hh = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hh[0], e = hh[4];
      const temp1 = hh[7]
        + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
        + ((e & hh[5]) ^ ((~e) & hh[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
          w[i - 16]
          + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3))
          + w[i - 7]
          + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))
        ) | 0);
      const temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hh[1]) ^ (a & hh[2]) ^ (hh[1] & hh[2]));
      hh.unshift((temp1 + temp2) | 0);
      hh[4] = (hh[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hh[i] + oldHash[i]) | 0;
  }
  let result = '';
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) {
    const b = (hash[i] >> (j * 8)) & 255;
    result += ((b < 16) ? 0 : '') + b.toString(16);
  }
  return result;
}

/* salted password hash — prefers the platform WebCrypto, falls back to sha256Hex */
const sha256 = async s => {
  try {
    if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return sha256Hex(s);
};

/* read an image file → compact square-ish JPEG data URL (fits comfortably in MQTT payloads) */
const fileToPic = file => new Promise(resolve => {
  if (!file || !/^image\//.test(file.type || '')) { resolve(null); return; }
  const fr = new FileReader();
  fr.onerror = () => resolve(null);
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => resolve(null);
    img.onload = () => {
      try {
        const MAX = 256;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { resolve(null); return; }
        const sc = Math.min(1, MAX / Math.max(w, h));
        w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = 0.72, url = cv.toDataURL('image/jpeg', q);
        while (url.length > 60000 && q > 0.4) { q -= 0.12; url = cv.toDataURL('image/jpeg', q); }
        resolve(url.length > 90000 ? null : url);
      } catch (e) { resolve(null); }
    };
    img.src = String(fr.result || '');
  };
  fr.readAsDataURL(file);
});

function AddFriendSheet({ onClose, onSend }) {
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const clean = normId(val);
  const submit = async () => {
    if (busy) return;
    if (!clean) { setMsg({ kind: 'err', text: ADDFRIEND_ERRS.bad }); return; }
    setBusy(true); setMsg(null);
    try {
      const p = await onSend(clean);
      setMsg({ kind: 'ok', text: 'Request sent to ' + (p && p.name ? p.name : chunkCode(clean)) + ' — you’ll see them here once they accept.' });
      setVal('');
    } catch (e) { setMsg({ kind: 'err', text: ADDFRIEND_ERRS[e] || ADDFRIEND_ERRS.offline }); }
    setBusy(false);
  };
  return html`<${Sheet} title="Add a friend" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Close</button>
      <button onClick=${submit} disabled=${busy || !clean} className=${'flex-1 rounded-full px-4 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' + (!clean || busy ? 'bg-ink/20 text-paper cursor-not-allowed' : 'bg-ink text-paper hover:bg-ink/90')}>${busy ? 'Sending…' : 'Send request'}</button>
    </div>`}>
    <div className="space-y-4">

        <label className="lbl">Friend’s ID</label>
        <input className="inp font-mono tracking-[.16em] uppercase text-[15px]" placeholder="THEIR-ID" spellCheck=${false} maxLength=${14}
          value=${val} onChange=${e => { setVal(e.target.value); setMsg(null); }}
          onKeyDown=${e => { if (e.key === 'Enter') submit(); }}/>
        ${clean && val !== clean && html`<p className="text-[11.5px] text-muted mt-1.5 numtab">Will send to ${chunkCode(clean)}</p>`}

      ${msg && html`<div className=${'rounded-2xl px-3.5 py-2.5 text-[12.5px] font-semibold leading-relaxed ' + (msg.kind === 'ok' ? 'bg-sage-tint text-sage-deep border border-sage/25' : 'bg-rust-tint text-rust-deep border border-rust/25')}>${msg.text}</div>`}
    </div>
  <//>`;
}

const FILE_META = {
  image: { tint: 'bg-sage-tint text-sage-deep', label: 'Photo' },
  video: { tint: 'bg-[#F3E8FF] text-[#8B5CF6]', label: 'Video' },
  audio: { tint: 'bg-[#E3EDFE] text-[#2563C9]', label: 'Audio' },
  pdf:   { tint: 'bg-rust-tint text-rust-deep', label: 'PDF' },
  zip:   { tint: 'bg-[#FCEFD4] text-[#B45309]', label: 'Archive' },
  doc:   { tint: 'bg-[#E3EDFE] text-[#2563C9]', label: 'Document' },
  file:  { tint: 'bg-paper text-muted', label: 'File' },
};
const XFER_ERR = {
  offline: 'You are offline — tap to retry',
  wake: 'Couldn’t reach them — tap to retry',
  drop: 'Transfer interrupted — tap to retry',
  save: 'Couldn’t save the file — tap to retry',
  rtc: 'Connection failed — tap to retry',
};

function FileBubble({ m, peerId, api }) {
  const x = (api.xfers || {})[m.id] || {};
  const kind = fileKindOf(m.mime, m.name);
  const meta = FILE_META[kind] || FILE_META.file;
  const isImg = kind === 'image';
  const [have, setHave] = useState(false);
  const [url, setUrl] = useState('');
  const done = !m.mine && (x.status === 'done' || have);
  const showImg = isImg && (m.mine || done);

  useEffect(() => {
    if (m.mine) return;
    let dead = false;
    api.loadFile(m.id).then(b => { if (!dead && b) setHave(true); });
    return () => { dead = true; };
  }, [m.id, m.mine]);

  useEffect(() => {
    if (!showImg) return;
    let dead = false, created = '';
    const f = m.mine ? api.peekOutFile(m.id) : null;
    const use = b => { if (b && b.size <= 31457280) { created = URL.createObjectURL(b); if (!dead) setUrl(created); else URL.revokeObjectURL(created); } };
    if (f) use(f);
    else api.loadFile(m.id).then(use);
    return () => { dead = true; if (created) URL.revokeObjectURL(created); };
  }, [showImg, m.id, m.mine]);

  const grab = () => {
    if (done || x.status === 'wait' || x.status === 'run') return;
    api.startDownload(peerId, m.id);
  };
  const saveBlob = async () => {
    const b = await api.loadFile(m.id);
    if (!b) return;
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = m.name || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  };
  const viewBlob = async () => {
    const b = m.mine ? (api.peekOutFile(m.id) || null) : await api.loadFile(m.id);
    if (b) window.open(URL.createObjectURL(b), '_blank');
  };

  const pct = Math.max(0, Math.min(100, Math.round((x.pct || 0) * 100)));
  return html`<div className=${'px-3 py-2.5 ' + (m.mine ? 'bg-ink text-paper rounded-2xl rounded-br-md' : 'bg-card border border-line text-ink rounded-2xl rounded-bl-md')}>
    ${showImg && url && html`<button onClick=${viewBlob} className="block mb-2" aria-label="View photo">
      <img src=${url} alt=${m.name || 'photo'} className="max-h-56 w-auto rounded-xl ${m.mine ? 'border border-paper/20' : 'border border-line'}"/>
    </button>`}
    <div className="flex items-center gap-2.5 min-w-[190px] max-w-full">
      ${(!showImg || !url) && html`<span className=${'w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ' + (m.mine ? 'bg-paper/10 text-paper/85' : meta.tint)}>
        <${Icon} name=${isImg ? 'camera' : 'doc'} size=${16}/>
      </span>`}
      <span className="flex-1 min-w-0">
        <span className="block text-[13.5px] font-semibold truncate">${m.name || 'file'}</span>
        <span className=${'block text-[11px] numtab ' + (m.mine ? 'text-paper/55' : 'text-muted')}>${prettyBytes(m.size)} · ${meta.label}</span>
      </span>
    </div>
    ${m.mine && html`<div className=${'mt-1.5 text-[10.5px] font-bold numtab ' + (x.status === 'ack' ? 'text-[#3DDC5C]' : 'text-paper/50')}>
      ${x.status === 'run' ? 'Sending · ' + pct + '%'
        : x.status === 'sent' ? 'Sent — waiting for them to download'
        : x.status === 'ack' ? 'Delivered'
        : x.status === 'err' ? 'Interrupted'
        : 'Sent'}
    </div>`}
    ${m.mine && x.status === 'run' && html`<div className="mt-1 h-1 rounded-full bg-paper/20 overflow-hidden">
      <div className="h-full bg-[#3DDC5C] rounded-full transition-all duration-300" style=${{ width: Math.max(3, pct) + '%' }}></div>
    </div>`}
    ${!m.mine && (x.status === 'run' || x.status === 'wait') && html`<div className="mt-2">
      ${x.status === 'run' && html`<div className="h-1.5 rounded-full bg-paper border border-line overflow-hidden">
        <div className="h-full bg-sage rounded-full transition-all duration-300" style=${{ width: Math.max(3, pct) + '%' }}></div>
      </div>`}
      <div className=${'mt-1 text-[10.5px] font-bold numtab flex items-center gap-1.5 ' + (x.status === 'run' ? 'text-sage-deep' : 'text-muted')}>

    </button>`}

}

/* ---------------- app · chat only ---------------- */

function App() {
  /* every open is brand-new — no IDs, friends or chats are ever stored on this device */
  const [db, setDb] = useState(freshDb);

  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const showToast = (msg, icon) => {
    const key = Date.now();
    setToast({ key, msg, icon });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  };

  /* ---------------- chat engine ---------------- */

  const chat = db.chat || freshChat();
  const patchChat = fn => setDb(d => ({ ...d, chat: fn(d.chat || freshChat()) }));

  const [chatView, setChatView] = useState('home');
  const [chatOn, setChatOn] = useState(false);
  const [presence, setPresence] = useState({});
  const [typing, setTyping] = useState({});
  const chatClientRef = useRef(null);
  const chatSubsRef = useRef(new Set());
  const removedIdsRef = useRef(new Set());      /* IDs removed on the network — this device never re-announces them */
  const chatRef = useRef(chat); chatRef.current = chat;
  const chatThreadRef = useRef(null); chatThreadRef.current = chatView === 'home' ? null : chatView;
  const typSentRef = useRef({});
  const restoreRef = useRef(false);   // pause state pushes while a restore lands
  const stateTimerRef = useRef(null);

  const chatPublish = (topic, obj, retain) => {
    const c = chatClientRef.current; if (!c) return false;
    try { c.publish(topic, obj === null ? '' : JSON.stringify(obj), { qos: 0, retain: !!retain }); return true; } catch (e) { return false; }
  };
  const meCard = me => ({ id: me.id, name: me.name, color: me.color });
  /* ---- file attachments (bytes go P2P over WebRTC; MQTT carries only signals) ---- */
  const [xfers, setXfers] = useState({});
  const xfRef = useRef({}); xfRef.current = xfers;
  const outFiles = useRef(new Map());   // mid -> File handle on this device
  const pcs = useRef(new Map());        // mid -> { pc, dc, role, open, done, cands }
  const inBufs = useRef(new Map());     // mid -> receiver reassembly buffer
  const pullTimers = useRef(new Map());

  const setXfer = (mid, patch) => setXfers(x => ({ ...x, [mid]: { ...(x[mid] || {}), ...patch } }));
  const teardownXfer = mid => {
    const p = pcs.current.get(mid);
    if (p) { try { if (p.dc) p.dc.close(); } catch (e) {} try { if (p.pc) p.pc.close(); } catch (e) {} pcs.current.delete(mid); }
    inBufs.current.delete(mid);
    const t = pullTimers.current.get(mid);
    if (t) { clearTimeout(t); pullTimers.current.delete(mid); }
  };

  /* pick a file (any type, ≤200 MB) and drop the metadata offer into the friend's inbox */
  const attachFile = (peerId, file) => {
    const me = chatRef.current.me;
    if (!me || !file) return;
    if (file.size > FILE_MAX) { showToast('Too large — files can be up to 200 MB', 'x'); return; }
    const mid = uid() + Date.now().toString(36);
    const meta = { name: String(file.name || 'file').slice(0, 120), size: file.size || 0, mime: file.type || '', ts: Date.now() };
    outFiles.current.set(mid, file);
    const ok = chatPublish(cTopic('inbox', peerId, 'off', mid), { app: 'splidchat', type: 'file-offer', id: mid, from: meCard(me), ...meta }, true);
    if (!ok) { outFiles.current.delete(mid); showToast('Chat is offline — try again when live', 'x'); return; }
    patchChat(c => {
      const th = { ...(c.threads || {}) };
      th[peerId] = [...(th[peerId] || []), { id: mid, mine: true, kind: 'file', ...meta }].slice(-300);
      return { ...c, threads: th };
    });
  };

  /* receiver side: ask the sender's device to start streaming this file */
  const startDownload = (peerId, mid) => {
    const me = chatRef.current.me;
    if (!me || pcs.current.has(mid)) return;
    const st = (xfRef.current[mid] || {}).status;
    if (st === 'wait' || st === 'run' || st === 'done') return;
    const old = pullTimers.current.get(mid); if (old) clearTimeout(old);
    setXfer(mid, { status: 'wait', pct: 0, err: '' });
    const ok = chatPublish(cTopic('inbox', peerId, 'pull', mid), { app: 'splidchat', type: 'file-pull', id: mid, from: me.id }, false);
    if (!ok) { setXfer(mid, { status: 'err', err: 'offline' }); return; }
    const t = setTimeout(() => {
      const p = pcs.current.get(mid);
      if (!p || !p.open) { setXfer(mid, { status: 'err', err: 'wake' }); teardownXfer(mid); }
    }, 15000);
    pullTimers.current.set(mid, t);
  };

  /* sender side: serve a pulled file over a chunked, backpressured data channel */
  const beginCarrier = (peerId, mid) => {
    const me = chatRef.current.me;
    if (!me || pcs.current.has(mid)) return;
    const file = outFiles.current.get(mid);
    if (!file) {
      chatPublish(cTopic('inbox', peerId, 'gone', mid), { app: 'splidchat', type: 'file-gone', id: mid, from: me.id }, false);
      return;
    }
    let pc;
    try { pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] }); }
    catch (e) { return; }
    const rec = { pc, dc: null, role: 'send', open: false, done: false, cands: [], bytes: 0, lastBytes: -1, lastMove: Date.now() };
    pcs.current.set(mid, rec);
    setXfer(mid, { status: 'run', pct: 0, err: '' });
    const fail = () => {
      if (rec.done) return;
      rec.done = true;
      setXfer(mid, { status: 'err', err: 'drop' });
      setTimeout(() => teardownXfer(mid), 600);
    };
    pc.onconnectionstatechange = () => { const s = pc.connectionState; if ((s === 'failed' || s === 'closed') && !rec.done) fail(); };
    pc.onicecandidate = e => {
      if (e.candidate) chatPublish(cTopic('inbox', peerId, 'rtc', mid), { app: 'splidchat', type: 'rtc-ice', id: mid, from: me.id, cand: e.candidate.toJSON() }, false);
    };
    const dc = pc.createDataChannel('f', { ordered: true });
    rec.dc = dc;
    try { dc.binaryType = 'arraybuffer'; dc.bufferedAmountLowThreshold = 262144; } catch (e) {}
    const waitLow = () => new Promise(res => {
      if (dc.bufferedAmount <= 262144) { res(); return; }
      const h = () => { dc.removeEventListener('bufferedamountlow', h); res(); };
      dc.addEventListener('bufferedamountlow', h);
    });
    const pump = async () => {
      const CHUNK = 16384, total = file.size || 1;
      try { dc.send(JSON.stringify({ t: 'hi', id: mid })); } catch (e) {}
      let off = 0, lastUi = 0;
      while (off < file.size) {
        if (dc.readyState !== 'open') throw new Error('closed');
        const buf = await file.slice(off, off + CHUNK).arrayBuffer();
        if (dc.readyState !== 'open') throw new Error('closed');
        dc.send(buf);
        off += buf.byteLength;
        rec.bytes = off;
        const now = Date.now();
        if (now - lastUi > 350) { lastUi = now; setXfer(mid, { pct: Math.min(1, off / total) }); }
        if (dc.bufferedAmount > 4194304) await waitLow();
      }
      rec.done = true;
      try { dc.send(JSON.stringify({ t: 'end', id: mid })); } catch (e) {}
      setXfer(mid, { pct: 1, status: 'sent' });
      setTimeout(() => { if ((xfRef.current[mid] || {}).status === 'sent') teardownXfer(mid); }, 8000);
    };
    dc.onopen = () => { rec.open = true; pump().catch(fail); };
    pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
      chatPublish(cTopic('inbox', peerId, 'rtc', mid), { app: 'splidchat', type: 'rtc-offer', id: mid, from: me.id, sdp: (pc.localDescription && pc.localDescription.sdp) || '' }, false);
    }).catch(fail);
  };

  /* receiver side: answer the sender's WebRTC offer and reassemble the stream */
  const acceptCarrier = (senderId, mid, sdp) => {
    const me = chatRef.current.me;
    if (!me || pcs.current.has(mid)) return;
    const st = (xfRef.current[mid] || {}).status;
    if (st !== 'wait' && st !== 'err') return;
    const old = pullTimers.current.get(mid); if (old) { clearTimeout(old); pullTimers.current.delete(mid); }
    let pc;
    try { pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] }); }
    catch (e) { setXfer(mid, { status: 'err', err: 'rtc' }); return; }
    const rec = { pc, dc: null, role: 'recv', open: false, done: false, cands: [], lastBytes: -1, lastMove: Date.now() };
    pcs.current.set(mid, rec);
    const buf = { chunks: [], got: 0, lastUi: 0, finished: false, total: 0 };
    buf.total = ((((chatRef.current.threads || {})[senderId] || []).find(x => x.id === mid) || {}).size) || 0;
    inBufs.current.set(mid, buf);
    const fail = () => {
      if (rec.done) return;
      rec.done = true;
      buf.finished = true; buf.chunks.length = 0;
      setXfer(mid, { status: 'err', err: 'drop' });
      setTimeout(() => teardownXfer(mid), 600);
    };
    pc.onconnectionstatechange = () => { const s = pc.connectionState; if ((s === 'failed' || s === 'closed') && !rec.open && !rec.done) fail(); };
    pc.onicecandidate = e => {
      if (e.candidate) chatPublish(cTopic('inbox', senderId, 'rtc', mid), { app: 'splidchat', type: 'rtc-ice', id: mid, from: me.id, cand: e.candidate.toJSON() }, false);
    };
    pc.ondatachannel = ev => {
      const dc = ev.channel;
      rec.dc = dc; rec.open = true;
      try { dc.binaryType = 'arraybuffer'; } catch (e) {}
      setXfer(mid, { status: 'run', pct: 0, err: '' });
      dc.onmessage = e => {
        if (typeof e.data === 'string') {
          let j; try { j = JSON.parse(e.data); } catch (err2) { return; }
          if (j && j.t === 'end') finishIn(senderId, mid);
          return;
        }
        buf.chunks.push(e.data);
        buf.got += (e.data.byteLength || 0);
        const now = Date.now();
        if (now - buf.lastUi > 350 && buf.total) { buf.lastUi = now; setXfer(mid, { pct: Math.min(1, buf.got / buf.total) }); }
      };
      dc.onclose = () => {
        if (!buf.finished && !rec.done) {
          rec.done = true; buf.finished = true; buf.chunks.length = 0;
          setXfer(mid, { status: 'err', err: 'drop' });
          setTimeout(() => teardownXfer(mid), 600);
        }
      };
    };
    pc.setRemoteDescription({ type: 'offer', sdp }).then(() => {
      rec.cands.forEach(c => { try { pc.addIceCandidate(c).catch(() => {}); } catch (e) {} });
      rec.cands = [];
      return pc.createAnswer();
    }).then(a => pc.setLocalDescription(a)).then(() => {
      chatPublish(cTopic('inbox', senderId, 'rtc', mid), { app: 'splidchat', type: 'rtc-answer', id: mid, from: me.id, sdp: (pc.localDescription && pc.localDescription.sdp) || '' }, false);
    }).catch(fail);
  };

  /* receiver: all chunks arrived — persist the blob and ack the sender */
  const finishIn = async (peerId, mid) => {
    const buf = inBufs.current.get(mid);
    const rec = pcs.current.get(mid);
    if (!buf || buf.finished) return;
    buf.finished = true;
    if (rec) rec.done = true;
    setXfer(mid, { pct: 1 });
    try {

    if (!ok) throw 'offline';
    patchChat(c => ({ ...c, reqsOut: { ...(c.reqsOut || {}), [reqId]: { reqId, to: { id: p.id, name: p.name || p.id, color: p.color, pic: p.pic || '' }, ts: Date.now() } } }));
    return p;
  };

  const acceptReq = reqId => {
    const r = (chat.reqsIn || {})[reqId]; if (!r || !r.from) return;
    patchChat(c => {
      const ri = { ...(c.reqsIn || {}) }; delete ri[reqId];
      const fr = { ...(c.friends || {}) };
      fr[r.from.id] = { id: r.from.id, name: r.from.name || r.from.id, color: r.from.color || AV[r.from.id.length % AV.length], pic: r.from.pic || '', since: Date.now() };
      return { ...c, reqsIn: ri, friends: fr };
    });
    chatPublish(cTopic('inbox', r.from.id, 'acc', reqId), { app:'splidchat', type:'friend-acc', reqId, from: { ...meCard(chat.me), pic: chat.me.pic || '' }, ts: Date.now() }, true);
    chatPublish(cTopic('inbox', chat.me.id, 'req', reqId), null, true);
    showToast((r.from.name || 'They') + ' is now your friend', 'check');
  };

  const declineReq = reqId => {
    const r = (chat.reqsIn || {})[reqId]; if (!r) return;
    patchChat(c => { const ri = { ...(c.reqsIn || {}) }; delete ri[reqId]; return { ...c, reqsIn: ri }; });
    chatPublish(cTopic('inbox', r.from.id, 'dec', reqId), { app:'splidchat', type:'friend-dec', reqId, from: meCard(chat.me), ts: Date.now() }, true);
    chatPublish(cTopic('inbox', chat.me.id, 'req', reqId), null, true);
  };

  const cancelReq = reqId => {
    const r = (chat.reqsOut || {})[reqId]; if (!r) return;
    patchChat(c => { const ro = { ...(c.reqsOut || {}) }; delete ro[reqId]; return { ...c, reqsOut: ro }; });
    chatPublish(cTopic('inbox', r.to.id, 'req', reqId), null, true);
  };

  const unfriend = fid => {
    patchChat(c => {
      const fr = { ...(c.friends || {}) }; delete fr[fid];
      const th = { ...(c.threads || {}) }; delete th[fid];
      const un = { ...(c.unread || {}) }; delete un[fid];
      return { ...c, friends: fr, threads: th, unread: un };
    });
    const c = chatClientRef.current;
    [cTopic('presence', fid), cTopic('profile', fid)].forEach(t => { chatSubsRef.current.delete(t); if (c) { try { c.unsubscribe(t); } catch (e) {} } });
    showToast('Friend removed', 'trash');
  };

  const sendMsg = (peerId, text) => {
    const me = chat.me; const t = String(text || '').trim().slice(0, 1000);
    if (!me || !t) return;
    const now = Date.now(), mid = uid();
    const ok = chatPublish(cTopic('inbox', peerId, 'msg', mid), { app:'splidchat', type:'chat-msg', id: mid, from: meCard(me), text: t, ts: now }, true);
    patchChat(c => {
      const th = { ...(c.threads || {}) };
      th[peerId] = [...(th[peerId] || []), { id: mid, mine: true, text: t, ts: now }].slice(-300);
      return { ...c, threads: th };
    });
    if (!ok) showToast('Chat is offline — message may not deliver', 'x');
  };

  const markRead = fid => {
    const arr = (chat.threads || {})[fid] || [];
    const upto = arr.length ? arr[arr.length - 1].ts : 0;
    if (((chat.unread || {})[fid] || 0) > 0) patchChat(c => ({ ...c, unread: { ...(c.unread || {}), [fid]: 0 } }));
    if (upto && chat.me) chatPublish(cTopic('inbox', fid, 'read'), { app:'splidchat', type:'read', by: chat.me.id, upto }, false);
  };

  const pingTyping = fid => {
    const now = Date.now();
    if (typSentRef.current[fid] && now - typSentRef.current[fid] < 2200) return;
    typSentRef.current[fid] = now;
    if (chat.me) chatPublish(cTopic('inbox', fid, 'typ'), { app:'splidchat', type:'typ', from: chat.me.id }, false);
  };
  const chatApi = { online: chatOn, presence, typing, xfers, createIdentity, logout: logoutChat, deleteAcc: deleteAccount, updateProfile, sendFriendReq, acceptReq, declineReq, cancelReq, unfriend, sendMsg, markRead, pingTyping, attachFile, startDownload, peekOutFile: mid => outFiles.current.get(mid) || null, loadFile: mid => loadFileBlob(mid),
  };

  /* the chat IS the app — always open, default view */
  return html`<div className="min-h-screen dotbg text-ink font-sans antialiased">
    <${ChatOverlay} chat=${chat} api=${chatApi} view=${chatView} setView=${setChatView}/>
    <${ToastView} toast=${toast}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
